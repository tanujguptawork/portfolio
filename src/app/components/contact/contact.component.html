<section id="contact" class="py-32 px-4 bg-gradient-to-b from-gray-50 to-white relative overflow-hidden">
  <!-- Background decorations -->
  <div class="absolute top-1/4 right-0 w-96 h-96 bg-blue-200/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-1/4 left-0 w-96 h-96 bg-purple-200/20 rounded-full blur-3xl"></div>

  <div *ngIf="contactData" class="max-w-6xl mx-auto relative z-10">
    <!-- Section Header -->
    <div [@fadeInUp] class="text-center mb-16">
      <div class="inline-block mb-4">
        <span class="text-blue-600 font-semibold tracking-wider uppercase text-sm">Get In Touch</span>
      </div>
      <h2 class="mb-4 bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">
        Let's Work Together
      </h2>
      <p class="text-gray-600 max-w-2xl mx-auto text-lg">
        {{ contactData.availability }}
      </p>
    </div>

    <div class="grid lg:grid-cols-2 gap-12">
      <!-- Contact Info -->
      <div [@fadeInUp] class="space-y-8">
        <div class="relative">
          <div class="absolute inset-0 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-3xl blur-2xl"></div>
          <div class="relative bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/20">
            <h3 class="mb-6">Contact Information</h3>
            <div class="space-y-6">
              <div class="flex items-center gap-4 group">
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-3 rounded-xl group-hover:scale-110 transition-transform">
                  <lucide-icon [img]="Mail" class="w-6 h-6 text-white"></lucide-icon>
                </div>
                <div>
                  <p class="text-sm text-gray-500">Email</p>
                  <a [href]="'mailto:' + contactData.email" class="text-lg hover:text-blue-600 transition-colors">{{ contactData.email }}</a>
                </div>
              </div>
              <div class="flex items-center gap-4 group">
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-3 rounded-xl group-hover:scale-110 transition-transform">
                  <lucide-icon [img]="Phone" class="w-6 h-6 text-white"></lucide-icon>
                </div>
                <div>
                  <p class="text-sm text-gray-500">Phone</p>
                  <a [href]="'tel:' + contactData.phone" class="text-lg hover:text-blue-600 transition-colors">{{ contactData.phone }}</a>
                </div>
              </div>
              <div class="flex items-center gap-4 group">
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-3 rounded-xl group-hover:scale-110 transition-transform">
                  <lucide-icon [img]="MapPin" class="w-6 h-6 text-white"></lucide-icon>
                </div>
                <div>
                  <p class="text-sm text-gray-500">Location</p>
                  <p class="text-lg">{{ contactData.location }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Social Links -->
        <div class="flex items-center gap-4">
          <a
            *ngFor="let social of socialLinks"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            class="bg-white/80 backdrop-blur-sm p-4 rounded-full shadow-lg border border-white/20 hover:bg-gradient-to-r hover:from-blue-600 hover:to-purple-600 hover:text-white hover:scale-110 transition-all duration-300"
          >
            <lucide-icon [img]="getIconClass(social.icon)" class="w-5 h-5"></lucide-icon>
          </a>
        </div>
      </div>

      <!-- Contact Form -->
      <div [@fadeInUp] class="relative">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-3xl blur-2xl"></div>
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="relative bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/20">
          <div class="space-y-6">
            <div>
              <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
              <input
                id="name"
                type="text"
                formControlName="name"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-600 focus:outline-none transition-colors"
                placeholder="Your Name"
              />
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-600 focus:outline-none transition-colors"
                placeholder="your.email@example.com"
              />
            </div>
            <div>
              <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">Subject</label>
              <input
                id="subject"
                type="text"
                formControlName="subject"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-600 focus:outline-none transition-colors"
                placeholder="What's this about?"
              />
            </div>
            <div>
              <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
              <textarea
                id="message"
                formControlName="message"
                rows="5"
                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-600 focus:outline-none transition-colors resize-none"
                placeholder="Your message here..."
              ></textarea>
            </div>
            <button
              type="submit"
              [disabled]="!contactForm.valid || isSubmitting"
              class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-4 rounded-full hover:shadow-2xl hover:scale-105 transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <lucide-icon [img]="Send" class="w-5 h-5"></lucide-icon>
              {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>
            <p *ngIf="submitSuccess" class="text-green-600 text-center">Message sent successfully!</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
