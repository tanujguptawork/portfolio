<section id="projects" class="py-32 px-4 relative overflow-hidden">
  <!-- Background decorations -->
  <div class="absolute inset-0 bg-gradient-to-b from-gray-50 via-white to-gray-50"></div>
  <div class="absolute top-1/4 right-0 w-96 h-96 bg-blue-200/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-1/4 left-0 w-96 h-96 bg-purple-200/20 rounded-full blur-3xl"></div>

  <div *ngIf="projectsData" class="max-w-7xl mx-auto relative z-10">
    <!-- Section Header -->
    <div [@fadeInUp] class="text-center mb-12">
      <div class="inline-block mb-4">
        <span class="text-blue-600 font-semibold tracking-wider uppercase text-sm">Portfolio</span>
      </div>
      <h2 class="mb-4 bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">
        Featured Projects
      </h2>
      <p class="text-gray-600 max-w-2xl mx-auto text-lg">
        A selection of my recent work showcasing innovation, creativity, and technical excellence
      </p>
    </div>

    <!-- Category Filter -->
    <div [@fadeInUp] class="flex flex-wrap justify-center gap-3 mb-16">
      <button
        *ngFor="let category of projectsData.categories"
        (click)="filterByCategory(category)"
        [class]="'px-6 py-2 rounded-full transition-all duration-300 ' + (selectedCategory === category ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg scale-105' : 'bg-white border-2 border-gray-200 hover:border-blue-600 hover:text-blue-600 shadow-md')"
      >
        {{ category }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div
        *ngFor="let project of filteredProjects; let i = index"
        (mouseenter)="setHoveredIndex(i)"
        (mouseleave)="setHoveredIndex(null)"
        class="group relative"
        [@scaleIn]
      >
        <!-- Glow effect -->
        <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl opacity-0 group-hover:opacity-20 blur-xl transition-all duration-300"></div>

        <div class="relative bg-white rounded-2xl overflow-hidden shadow-xl hover:shadow-2xl transition-all duration-300">
          <!-- Featured Badge -->
          <div *ngIf="project.featured" class="absolute top-4 right-4 z-20 bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full text-xs flex items-center gap-1 shadow-lg">
            <lucide-icon [img]="Star" class="w-3 h-3 fill-current"></lucide-icon>
            Featured
          </div>

          <!-- Image -->
          <div class="relative overflow-hidden h-56">
            <img
              [src]="project.image"
              [alt]="project.title"
              class="w-full h-full object-cover transition-transform duration-400"
              [class.scale-110]="hoveredIndex === i"
            />

            <!-- Overlay -->
            <div
              *ngIf="hoveredIndex === i"
              class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/50 to-transparent flex items-end justify-center pb-6 gap-4"
            >
              <a
                [href]="project.github"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-white text-gray-900 p-3 rounded-full hover:bg-gray-100 transition-colors shadow-lg hover:scale-110 hover:-translate-y-1"
              >
                <lucide-icon [img]="Github" class="w-5 h-5"></lucide-icon>
              </a>
              <a
                [href]="project.live"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-blue-600 text-white p-3 rounded-full hover:bg-blue-700 transition-colors shadow-lg hover:scale-110 hover:-translate-y-1"
              >
                <lucide-icon [img]="ExternalLink" class="w-5 h-5"></lucide-icon>
              </a>
            </div>
          </div>

          <!-- Content -->
          <div class="p-6">
            <h3 class="mb-2 group-hover:text-blue-600 transition-colors">{{ project.title }}</h3>
            <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ project.description }}</p>
            <div class="flex flex-wrap gap-2">
              <span
                *ngFor="let tech of project.technologies"
                class="bg-gradient-to-r from-blue-50 to-purple-50 text-blue-700 text-xs px-3 py-1.5 rounded-full border border-blue-100"
              >
                {{ tech }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- View All CTA -->
    <div [@fadeInUp] class="text-center mt-16">
      <a
        href="https://github.com"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-4 rounded-full hover:shadow-2xl hover:scale-105 transition-all duration-300"
      >
        <lucide-icon [img]="Github" class="w-5 h-5"></lucide-icon>
        View All Projects on GitHub
      </a>
    </div>
  </div>
</section>
