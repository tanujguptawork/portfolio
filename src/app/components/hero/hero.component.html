<section class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <!-- Animated gradient background -->
  <div class="absolute inset-0 bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSAxMCAwIEwgMCAwIDAgMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjAzKSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-40"></div>
  </div>

  <div *ngIf="heroData" class="max-w-6xl mx-auto text-center relative z-10">
    <!-- Availability Badge -->
    <div [@fadeInUp] class="mb-6">
      <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg border border-white/20">
        <lucide-icon [img]="Sparkles" class="w-4 h-4 text-yellow-500"></lucide-icon>
        <span class="text-sm">{{ heroData.availability.text }}</span>
      </div>
    </div>

    <!-- Name -->
    <div [@fadeInUp]>
      <h1 class="mb-6 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
        Hi, I'm <span class="inline-block">{{ heroData.name }}</span>
      </h1>
    </div>

    <!-- Rotating Roles -->
    <div [@fadeInUp] class="mb-8">
      <div class="text-2xl md:text-4xl min-h-[3rem] flex items-center justify-center">
        <span class="bg-gradient-to-r from-gray-700 to-gray-900 bg-clip-text text-transparent">
          {{ heroData.roles[currentRole] }}
        </span>
      </div>
    </div>

    <!-- Tagline -->
    <p [@fadeInUp] class="text-lg text-gray-600 max-w-2xl mx-auto mb-12">
      {{ heroData.tagline }}
    </p>

    <!-- CTA Buttons -->
    <div [@fadeInUp] class="flex flex-wrap items-center justify-center gap-4 mb-12">
      <a
        [href]="heroData.cta.primary.link"
        (click)="scrollToSection(heroData.cta.primary.link)"
        class="group bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-4 rounded-full hover:shadow-2xl hover:scale-105 transition-all duration-300 flex items-center gap-2"
      >
        <lucide-icon [img]="Rocket" class="w-5 h-5 group-hover:rotate-12 transition-transform"></lucide-icon>
        {{ heroData.cta.primary.text }}
      </a>
      <a
        *ngIf="heroData.cta.resume"
        [href]="getResumeHref(heroData.cta.resume.file)"
        download
        class="group bg-white/80 backdrop-blur-sm border-2 border-gray-200 px-8 py-4 rounded-full hover:border-blue-600 hover:text-blue-700 hover:shadow-xl transition-all duration-300 flex items-center gap-2"
      >
        <lucide-icon [img]="FileDown" class="w-5 h-5 group-hover:translate-y-0.5 transition-transform"></lucide-icon>
        {{ heroData.cta.resume.text }}
      </a>
      <a
        [href]="heroData.cta.secondary.link"
        (click)="scrollToSection(heroData.cta.secondary.link)"
        class="group bg-white/80 backdrop-blur-sm border-2 border-gray-200 px-8 py-4 rounded-full hover:border-purple-600 hover:text-purple-600 hover:shadow-xl transition-all duration-300 flex items-center gap-2"
      >
        <lucide-icon [img]="Code2" class="w-5 h-5 group-hover:scale-110 transition-transform"></lucide-icon>
        {{ heroData.cta.secondary.text }}
      </a>
    </div>

    <!-- Social Links -->
    <div [@fadeIn] class="flex items-center justify-center gap-4">
      <a
        *ngFor="let social of socialLinks"
        [href]="social.url"
        target="_blank"
        rel="noopener noreferrer"
        [class]="'bg-white/80 backdrop-blur-sm p-4 rounded-full shadow-lg border border-white/20 hover:text-white transition-all duration-300 hover:scale-110 hover:-translate-y-1 ' + getColorClass(social.platform)"
      >
        <lucide-icon [img]="getIconClass(social.icon)" class="w-5 h-5"></lucide-icon>
      </a>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <a
    href="#about"
    (click)="scrollToSection('#about')"
    [@fadeIn]
    class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-white/80 backdrop-blur-sm p-3 rounded-full shadow-lg animate-bounce"
  >
    <lucide-icon [img]="ArrowDown" class="w-5 h-5 text-gray-600"></lucide-icon>
  </a>
</section>
