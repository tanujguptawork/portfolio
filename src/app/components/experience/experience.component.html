<section id="experience" class="py-32 px-4 relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0 bg-gradient-to-b from-white via-purple-50/30 to-white"></div>
  <div class="absolute top-1/3 left-0 w-96 h-96 bg-blue-200/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-1/3 right-0 w-96 h-96 bg-purple-200/20 rounded-full blur-3xl"></div>

  <div *ngIf="experienceData" class="max-w-6xl mx-auto relative z-10">
    <!-- Section Header -->
    <div [@fadeInUp] class="text-center mb-16">
      <div class="inline-block mb-4">
        <span class="text-blue-600 font-semibold tracking-wider uppercase text-sm">My Journey</span>
      </div>
      <h2 class="mb-4 bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">
        Experience & Education
      </h2>
      <p class="text-gray-600 max-w-2xl mx-auto text-lg">
        My professional journey and the milestones that shaped my career
      </p>
    </div>

    <div class="relative">
      <!-- Timeline line -->
      <div class="absolute left-4 md:left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-blue-400 via-purple-400 to-pink-400 rounded-full md:-translate-x-1/2"></div>

      <div
        *ngFor="let exp of experienceData.experiences; let i = index"
        [@fadeInUp]
        (mouseenter)="setHoveredIndex(i)"
        (mouseleave)="setHoveredIndex(null)"
        [class]="'relative mb-16 ' + (isEven(i) ? 'md:pr-1/2' : 'md:pl-1/2')"
      >
        <!-- Timeline connector -->
        <div [class]="'absolute top-8 w-12 h-0.5 bg-gradient-to-r ' + exp.color + ' hidden md:block ' + (isEven(i) ? 'right-0 md:right-1/2' : 'left-1/2')"></div>

        <!-- Timeline dot -->
        <div class="absolute left-0 md:left-1/2 top-6 md:-translate-x-1/2 z-20">
          <div
            [class]="'bg-gradient-to-r ' + exp.color + ' p-4 rounded-full shadow-2xl ring-4 ring-white transition-transform duration-500 ' + (hoveredIndex === i ? 'scale-125 rotate-360' : 'scale-100')"
          >
            <lucide-icon [img]="exp.type === 'work' ? Briefcase : GraduationCap" class="w-6 h-6 text-white"></lucide-icon>
          </div>
        </div>

        <div [class]="'pl-20 md:pl-0 ' + (isEven(i) ? 'md:pr-20' : 'md:pl-20')">
          <div
            [class]="'timeline-card group relative transition-all duration-300 ' + (hoveredIndex === i ? 'scale-102' : 'scale-100')"
          >
            <!-- Animated glow effect -->
            <div
              [class]="'absolute -inset-1 bg-gradient-to-r ' + exp.color + ' rounded-3xl blur-2xl transition-all duration-500 ' + (hoveredIndex === i ? 'opacity-30' : 'opacity-0')"
            ></div>

            <div class="relative bg-white/95 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-white/40 hover:shadow-2xl transition-all duration-500">
              <!-- Header -->
              <div class="flex items-start justify-between mb-4 flex-wrap gap-3">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-2 flex-wrap">
                    <h3 [class]="'text-2xl font-bold bg-gradient-to-r ' + exp.color + ' bg-clip-text text-transparent'">
                      {{ exp.title }}
                    </h3>
                    <span *ngIf="exp.type === 'work'" [class]="'bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold'">
                      {{ exp.duration }}
                    </span>
                  </div>
                  <p class="text-gray-800 text-lg font-semibold mb-2">{{ exp.company }}</p>
                  <div class="flex flex-wrap gap-4 text-sm text-gray-600">
                    <div class="flex items-center gap-1.5">
                      <lucide-icon [img]="Calendar" class="w-4 h-4"></lucide-icon>
                      <span>{{ exp.period }}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <lucide-icon [img]="MapPin" class="w-4 h-4"></lucide-icon>
                      <span>{{ exp.location }}</span>
                    </div>
                  </div>
                </div>

                <!-- Type badge -->
                <div [class]="'bg-gradient-to-r ' + exp.color + ' p-3 rounded-2xl shadow-lg'">
                  <lucide-icon [img]="exp.type === 'work' ? TrendingUp : Award" class="w-6 h-6 text-white"></lucide-icon>
                </div>
              </div>

              <!-- Description -->
              <p class="text-gray-700 mb-6 leading-relaxed text-base">
                {{ exp.description }}
              </p>

              <!-- Achievements -->
              <div class="mb-6">
                <h4 class="text-sm font-bold uppercase tracking-wider text-gray-700 mb-4">Key Achievements</h4>
                <ul class="space-y-3">
                  <li
                    *ngFor="let achievement of exp.achievements"
                    class="flex items-start gap-3 group/item"
                  >
                    <div [class]="'achievement-bullet mt-0.5 p-1.5 rounded-full bg-gradient-to-r ' + exp.color + ' flex-shrink-0'">
                      <div class="w-2 h-2 bg-white rounded-full"></div>
                    </div>
                    <span class="text-gray-700 group-hover/item:text-gray-900 transition-colors flex-1 text-base">
                      {{ achievement }}
                    </span>
                  </li>
                </ul>
              </div>

              <!-- Technologies -->
              <div>
                <h4 class="text-sm font-bold uppercase tracking-wider text-gray-700 mb-4">Technologies Used</h4>
                <div class="flex flex-wrap gap-2">
                  <span
                    *ngFor="let tech of exp.technologies"
                    class="tech-badge bg-gradient-to-r from-blue-50 to-purple-50 px-4 py-2 rounded-full text-sm font-medium text-gray-700 border border-gray-200 hover:border-blue-400 hover:shadow-md"
                  >
                    {{ tech }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
